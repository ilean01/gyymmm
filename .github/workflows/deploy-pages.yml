name: Deploy GymBro to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check repository history for secrets
        run: npm run check:secrets

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck API
        working-directory: api
        run: npm run typecheck

      - name: API acceptance and isolation tests
        run: |
          printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 48)" > api/.dev.vars
          cd api
          npx wrangler d1 migrations apply gymbro-db --local
          npm run dev -- --port 8787 > ../wrangler-ci.log 2>&1 &
          echo $! > ../wrangler-ci.pid
          cd ..
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/health
          node scripts/api-acceptance.mjs

      - name: Stop local Worker
        if: always()
        run: |
          if [ -f wrangler-ci.pid ]; then
            kill "$(cat wrangler-ci.pid)" || true
          fi
          rm -f api/.dev.vars

      - name: Build production frontend
        env:
          VITE_API_URL: https://gymbro-api.ileanasanabria14.workers.dev
          VITE_AUTH_REQUIRED: "true"
        run: npm run build

      - name: Verify PWA output
        run: npm run verify:pwa

      - name: SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          test -f dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
