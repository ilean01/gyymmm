name: Deploy GymBro to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Check repository history for secrets
        run: npm run check:secrets

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck API
        working-directory: api
        run: npm run typecheck

      - name: Build production frontend
        env:
          VITE_API_URL: https://gymbro-api.ileanasanabria14.workers.dev
          VITE_AUTH_REQUIRED: "true"
        run: npm run build

      - name: Verify PWA output
        run: npm run verify:pwa

      - name: SPA fallback for GitHub Pages
        run: |
          cp dist/index.html dist/404.html
          test -f dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
