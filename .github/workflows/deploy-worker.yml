name: Deploy GymBro API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Typecheck API
        working-directory: api
        run: npm run typecheck

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Falta el secret CLOUDFLARE_API_TOKEN en GitHub."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Falta el secret CLOUDFLARE_ACCOUNT_ID en GitHub."
            exit 1
          }

      - name: Apply production D1 migrations
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply gymbro-db --remote --yes

      - name: Deploy Worker
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify production API
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent \
              https://gymbro-api.ileanasanabria14.workers.dev/health \
              > health.json; then
              break
            fi
            sleep 2
          done
          cat health.json
          node -e "
            const fs=require('fs');
            const h=JSON.parse(fs.readFileSync('health.json','utf8'));
            if (
              !h.ok ||
              !h.authReady ||
              !h.databaseReady ||
              !h.schemaReady ||
              h.latestMigration !== '0010_exercise_images.sql'
            ) {
              console.error('La API de producción todavía no está lista.');
              process.exit(1);
            }
            console.log('GymBro API producción verificada.');
          "

      - name: Production acceptance and isolation tests
        env:
          GYMBRO_API_URL: https://gymbro-api.ileanasanabria14.workers.dev
        run: node scripts/api-acceptance.mjs

      - name: Clean production CI users
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute gymbro-db --remote --command \
            "DELETE FROM users WHERE email LIKE 'gymbro-ci-%@example.com';"
